# AeroSpace manages virtual workspaces; every window stays floating.
config-version = 2
start-at-login = true
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0']
after-startup-command = ['exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change']

# Notify the bar for all workspace switches, including clicks and CLI commands.
exec-on-workspace-change = ['/bin/bash', '-c',
    '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]
on-focus-changed = ['exec-and-forget /opt/homebrew/bin/sketchybar --trigger focus_change']
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

# This applies to windows discovered at startup as well as newly opened windows.
[[on-window-detected]]
if = 'true'
run = 'layout floating'

[key-mapping]
preset = 'qwerty'

[mode.main.binding]
# Focus floating windows without moving or resizing them.
alt-left = 'focus left'
alt-down = 'focus down'
alt-up = 'focus up'
alt-right = 'focus right'
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Instant workspace switching.
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 0'
alt-keypad1 = 'workspace 1'
alt-keypad2 = 'workspace 2'
alt-keypad3 = 'workspace 3'
alt-keypad4 = 'workspace 4'
alt-keypad5 = 'workspace 5'
alt-keypad6 = 'workspace 6'
alt-keypad7 = 'workspace 7'
alt-keypad8 = 'workspace 8'
alt-keypad9 = 'workspace 9'
alt-keypad0 = 'workspace 0'

# Send the focused window to a workspace, retaining its floating layout.
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 0'
alt-shift-keypad1 = 'move-node-to-workspace 1'
alt-shift-keypad2 = 'move-node-to-workspace 2'
alt-shift-keypad3 = 'move-node-to-workspace 3'
alt-shift-keypad4 = 'move-node-to-workspace 4'
alt-shift-keypad5 = 'move-node-to-workspace 5'
alt-shift-keypad6 = 'move-node-to-workspace 6'
alt-shift-keypad7 = 'move-node-to-workspace 7'
alt-shift-keypad8 = 'move-node-to-workspace 8'
alt-shift-keypad9 = 'move-node-to-workspace 9'
alt-shift-keypad0 = 'move-node-to-workspace 0'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
alt-shift-c = 'close --quit-if-last-window'
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
# Reassert floating, never toggle back to tiling.
f = ['layout floating', 'mode main']
down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']
